<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fabians und Claudias Hochzeitseinladung – Ein Panik Point &amp; Click</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%23241b2f%22/><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%238a5a3b%22/></svg>">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">

    <header id="titlebar">
      <svg id="header-art" viewBox="0 0 320 56" preserveAspectRatio="xMidYMid meet"></svg>
      <p id="titlebar-sub">Fabians Einladungen <span>– Panik im Wald</span></p>
    </header>

    <div id="stage">
      <svg id="scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="hotspots"></div>

      <div id="dialogue" class="hidden">
        <div id="dialogue-text"></div>
        <div id="dialogue-choices"></div>
      </div>

      <div id="intro">
        <button id="intro-skip-btn" class="overlay-btn secondary small">Überspringen »</button>
        <svg id="intro-scene" class="overlay-scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"></svg>
        <p id="intro-text"></p>
        <button id="intro-next-btn" class="overlay-btn">Weiter →</button>
      </div>

      <div id="namecard" class="hidden">
        <p id="namecard-text">Und da, wie gerufen, kommst ausgerechnet <strong>DU</strong> um die Ecke.<br>Wie heißt du?</p>
        <input id="name-input" type="text" maxlength="20" placeholder="Dein Name" autocomplete="off" />
        <button id="name-submit-btn" class="overlay-btn">Helfen! 🐾</button>
      </div>

      <div id="endcard" class="hidden">
        <div id="endcard-inner">
          <h2 id="endcard-title"></h2>
          <div id="endcard-text"></div>
          <button id="restart-btn" class="overlay-btn">🔁 Nochmal von vorn</button>
        </div>
      </div>
    </div>

    <div id="caption">Willkommen! Klick dich durch den Wald.</div>

    <div id="ui">
      <div id="verbs">
        <button class="verb" data-verb="look" data-tooltip="Ansehen" aria-label="Ansehen">
          <svg viewBox="0 0 24 24" fill="none"><path d="M2 12c2.8-4.8 6.6-7.2 10-7.2S19.2 7.2 22 12c-2.8 4.8-6.6 7.2-10 7.2S4.8 16.8 2 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>
        </button>
        <button class="verb" data-verb="talk" data-tooltip="Reden" aria-label="Reden">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 5h18v11H9.5L5 20v-4H3V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="10.5" r="1.15" fill="currentColor"/><circle cx="12" cy="10.5" r="1.15" fill="currentColor"/><circle cx="16" cy="10.5" r="1.15" fill="currentColor"/></svg>
        </button>
        <button class="verb" data-verb="take" data-tooltip="Nehmen" aria-label="Nehmen">
          <svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="16.5" rx="6.2" ry="4.6" fill="currentColor"/><circle cx="5.2" cy="8.6" r="2.5" fill="currentColor"/><circle cx="10.7" cy="5" r="2.5" fill="currentColor"/><circle cx="16.5" cy="5.4" r="2.5" fill="currentColor"/><circle cx="20.6" cy="9.8" r="2.2" fill="currentColor"/></svg>
        </button>
        <button class="verb" data-verb="use" data-tooltip="Benutzen" aria-label="Benutzen">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1M18.6 18.6l-2.1-2.1M7.5 7.5L5.4 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="inventory">
        <div id="inventory-label">TASCHE:</div>
        <div id="inventory-items"></div>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
